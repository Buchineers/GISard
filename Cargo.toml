[package]
name = "gisard"
version = "0.1.0"
edition = "2024"

[features]
default = []
dashboard = ["dep:crossterm", "dep:ratatui"]
visualizer = ["dep:visualizer"]

[[bin]]
name = "campaign_dashboard"
required-features = ["dashboard"]

[[bin]]
name = "sandbox"
required-features = ["visualizer"]

[dependencies]
blake3 = { version = "1.8.5", features = ["pure"] }
crossterm = { version = "0.29.0", optional = true }
framework = { path = "crates/framework" }
good_lp = { version = "1.15.2", default-features = false, features = ["highs"] }
highs = "2.2.0"
mimalloc = "0.1.52"
rand = "0.10.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
visualizer = { path = "crates/visualizer", optional = true }

[workspace]
members = [
    "crates/framework",
    "crates/visualizer",
]
